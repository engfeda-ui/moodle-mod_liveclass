# GitHub Actions workflow for LiveClass Moodle plugin CI (Pillar 4 Harness Standard).
name: Moodle Plugin CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: Quality Gates & Security Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, curl, xml, zip, intl, sodium

      - name: Run Antigravity Quality Gates (Pillar 4)
        run: node tests/run-all.js

  moodle-ci:
    name: Moodle Plugin CI (Postgres & PHPUnit)
    runs-on: ubuntu-latest
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        moodle-branch: ['MOODLE_405_STABLE']
        php: ['8.2']

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          path: mod/liveclass

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mbstring, gd, curl, xml, zip, intl, sodium
          ini-values: max_execution_time=600, memory_limit=512M, max_input_vars=5000
          tools: composer:v2

      - name: Setup System Locales
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: Setup Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> $GITHUB_PATH
          echo "$(cd ci/vendor/bin; pwd)" >> $GITHUB_PATH

      - name: Install Moodle
        run: moodle-plugin-ci install --plugin mod/liveclass --db-host=127.0.0.1 --db-user=postgres --db-name=moodle_ci_db --db-pass="" --db-type=pgsql
        env:
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint mod/liveclass

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Moodle PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit

